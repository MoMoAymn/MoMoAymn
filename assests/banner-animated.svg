<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Hello, I'm Mohamed Ayman</title>
<desc id="d">Computer Engineering student who builds software. A signal waveform with one fault spike leads into a node graph.</desc>
<style>
.draw{stroke-dasharray:1;animation:draw 2.4s cubic-bezier(.4,0,.2,1) both}
.conn{stroke-dasharray:1;animation:draw .35s 2.35s linear both}
.spike{stroke-dasharray:1;animation:draw .4s 1.6s linear both, pulse 2.6s 2.4s ease-in-out infinite}
.e{stroke-dasharray:1;animation:draw .35s linear both}
.n{transform-box:fill-box;transform-origin:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.t{animation:rise .7s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
